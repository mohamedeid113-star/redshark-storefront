<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>RedShark Master Portal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Owner-only console. All styles are in this file: nothing here changes the customer store pages. -->
  <style>
    :root {
      --bg: #0a0e16;
      --surface: #10161f;
      --surface-2: #151c28;
      --surface-3: #1b2433;
      --line: rgba(148, 163, 184, 0.12);
      --line-strong: rgba(148, 163, 184, 0.24);
      --text: #e7ebf3;
      --text-2: #a3adbf;
      --muted: #6f7a8e;
      --brand: #ef4444;
      --brand-2: #b91c1c;
      --accent: #7c8cff;
      --ok: #22c55e;
      --warn: #f59e0b;
      --bad: #f43f5e;
      --info: #38bdf8;
      --radius: 14px;
      --font-ar: 'Cairo', 'Plus Jakarta Sans', system-ui, sans-serif;
      --font-en: 'Plus Jakarta Sans', system-ui, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); }
    body {
      color: var(--text);
      font-family: var(--font-ar);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    html[dir="ltr"] body { font-family: var(--font-en); }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    .mono { font-family: var(--mono); }
    .muted { color: var(--muted); }
    .hidden { display: none !important; }

    /* ─── Top bar ─────────────────────────────────────────────────────────── */
    .topbar {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; gap: 16px;
      padding: 12px 24px;
      background: rgba(10, 14, 22, 0.86);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark {
      width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0;
      display: grid; place-items: center; color: #fff; font-size: 1.05rem;
      background: linear-gradient(140deg, var(--brand), var(--brand-2));
      box-shadow: 0 6px 18px rgba(239, 68, 68, 0.28);
    }
    .brand h1 { font-size: 1rem; font-weight: 800; letter-spacing: -0.01em; white-space: nowrap; }
    .brand p { font-size: 0.74rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar-search { flex: 1; max-width: 460px; margin-inline-start: auto; position: relative; }
    .topbar-search i { position: absolute; top: 50%; transform: translateY(-50%); inset-inline-start: 13px; color: var(--muted); font-size: 0.85rem; }
    .topbar-search input {
      width: 100%; height: 38px; border-radius: 10px;
      background: var(--surface); border: 1px solid var(--line);
      padding-inline: 38px 12px; font-size: 0.86rem; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .topbar-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124, 140, 255, 0.18); }
    .topbar-actions { display: flex; align-items: center; gap: 8px; }

    .btn {
      height: 38px; padding: 0 14px; border-radius: 10px;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 0.84rem; font-weight: 700; white-space: nowrap;
      background: var(--surface); border: 1px solid var(--line); color: var(--text);
      transition: background .15s, border-color .15s, transform .1s;
    }
    .btn:hover { background: var(--surface-3); border-color: var(--line-strong); }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: linear-gradient(140deg, var(--brand), #dc2626); border-color: transparent; color: #fff; box-shadow: 0 4px 14px rgba(239, 68, 68, 0.25); }
    .btn-primary:hover { background: linear-gradient(140deg, #f05252, #e02424); border-color: transparent; }
    .btn-sm { height: 30px; padding: 0 10px; font-size: 0.78rem; border-radius: 8px; gap: 6px; }
    .btn-icon { width: 30px; padding: 0; }
    .btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); }
    .btn-ghost:hover { background: var(--surface-3); color: var(--text); }
    .btn-danger { color: #fda4af; border-color: rgba(244, 63, 94, 0.3); background: rgba(244, 63, 94, 0.08); }
    .btn-danger:hover { background: rgba(244, 63, 94, 0.16); border-color: rgba(244, 63, 94, 0.45); }
    .btn-accent { color: #c7d0ff; border-color: rgba(124, 140, 255, 0.32); background: rgba(124, 140, 255, 0.1); }
    .btn-accent:hover { background: rgba(124, 140, 255, 0.18); border-color: rgba(124, 140, 255, 0.5); }

    /* ─── Page ────────────────────────────────────────────────────────────── */
    .page { max-width: 1520px; margin: 0 auto; padding: 22px 24px 60px; }

    .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; margin-bottom: 20px; }
    .kpi {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 16px 18px; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
      cursor: pointer; transition: border-color .15s, background .15s;
    }
    .kpi:hover { border-color: var(--line-strong); background: var(--surface-2); }
    .kpi.active { border-color: rgba(124, 140, 255, 0.5); background: var(--surface-2); }
    .kpi-label { font-size: 0.76rem; font-weight: 700; color: var(--text-2); }
    .kpi-value { font-family: var(--font-en); font-size: 1.75rem; font-weight: 800; line-height: 1.15; margin-top: 4px; letter-spacing: -0.02em; }
    .kpi-sub { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
    .kpi-icon { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0; font-size: 0.95rem; }
    .tone-ok { color: var(--ok); } .tone-warn { color: var(--warn); } .tone-bad { color: var(--bad); } .tone-info { color: var(--info); } .tone-accent { color: var(--accent); }
    .bg-ok { background: rgba(34, 197, 94, 0.12); } .bg-warn { background: rgba(245, 158, 11, 0.12); } .bg-bad { background: rgba(244, 63, 94, 0.12); } .bg-info { background: rgba(56, 189, 248, 0.12); } .bg-accent { background: rgba(124, 140, 255, 0.13); }

    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .segmented { display: flex; gap: 4px; flex-wrap: wrap; }
    .seg {
      height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid transparent; background: transparent;
      color: var(--text-2); font-size: 0.8rem; font-weight: 700; display: inline-flex; align-items: center; gap: 7px;
    }
    .seg:hover { background: var(--surface-3); color: var(--text); }
    .seg.active { background: var(--surface-3); border-color: var(--line-strong); color: var(--text); }
    .seg .count { font-family: var(--font-en); font-size: 0.7rem; padding: 0 6px; border-radius: 99px; background: rgba(148, 163, 184, 0.14); color: var(--text-2); }
    .panel-meta { font-size: 0.76rem; color: var(--muted); display: flex; align-items: center; gap: 8px; }

    /* ─── Shops table ─────────────────────────────────────────────────────── */
    .table-wrap { overflow-x: auto; }
    table.shops { width: 100%; border-collapse: collapse; }
    .shops th {
      text-align: start; font-size: 0.72rem; font-weight: 800; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.04em;
      padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface);
    }
    .shops td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    .shops tbody tr:last-child td { border-bottom: 0; }
    .shops tbody tr:hover td { background: rgba(148, 163, 184, 0.035); }
    .shops tr.is-inactive td:first-child { opacity: .65; }

    .shop-cell { display: flex; align-items: center; gap: 12px; min-width: 220px; }
    .avatar {
      width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0; display: grid; place-items: center;
      font-weight: 800; font-size: 0.95rem; color: #fff; font-family: var(--font-en);
    }
    .shop-name { font-weight: 800; font-size: 0.92rem; line-height: 1.3; }
    .shop-sub { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 2px; font-size: 0.74rem; color: var(--muted); }
    .slug { font-family: var(--mono); font-size: 0.74rem; color: #7dd3fc; }
    .pwd { display: inline-flex; align-items: center; gap: 2px; font-family: var(--mono); font-size: 0.74rem; color: var(--text-2); }
    .pwd button { border: 0; background: transparent; color: var(--muted); padding: 1px 4px; border-radius: 4px; font-size: 0.72rem; }
    .pwd button:hover { color: var(--text); background: var(--surface-3); }

    .chip {
      display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
      height: 24px; padding: 0 9px; border-radius: 99px; font-size: 0.74rem; font-weight: 700;
      border: 1px solid transparent; background: rgba(148, 163, 184, 0.1); color: var(--text-2);
    }
    .chip.ok { background: rgba(34, 197, 94, 0.1); color: #86efac; border-color: rgba(34, 197, 94, 0.22); }
    .chip.warn { background: rgba(245, 158, 11, 0.1); color: #fcd34d; border-color: rgba(245, 158, 11, 0.24); }
    .chip.bad { background: rgba(244, 63, 94, 0.1); color: #fda4af; border-color: rgba(244, 63, 94, 0.26); }
    .chip.info { background: rgba(56, 189, 248, 0.1); color: #7dd3fc; border-color: rgba(56, 189, 248, 0.24); }
    .chip.none { background: transparent; color: var(--muted); border-color: var(--line); }
    button.chip { cursor: pointer; }
    button.chip:hover { filter: brightness(1.15); }
    .cell-stack { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }
    .cell-note { font-size: 0.71rem; color: var(--muted); white-space: nowrap; }

    .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    .dot.live { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6); animation: live 1.8s infinite; }
    @keyframes live { 0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.55); } 70% { box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }

    .row-actions { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }

    .empty-state { text-align: center; padding: 56px 16px; color: var(--muted); }
    .empty-state i { font-size: 1.8rem; display: block; margin-bottom: 10px; opacity: .7; }

    /* ─── Row menu (fixed, so the table never clips it) ───────────────────── */
    .menu {
      position: fixed; z-index: 400; min-width: 210px; padding: 6px;
      background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 12px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.5);
    }
    .menu button, .menu a {
      width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px;
      border: 0; background: transparent; font-size: 0.83rem; font-weight: 600; color: var(--text); text-align: start;
    }
    .menu button:hover, .menu a:hover { background: var(--surface-3); }
    .menu i { width: 16px; text-align: center; color: var(--text-2); }
    .menu .sep { height: 1px; background: var(--line); margin: 5px 4px; }
    .menu .danger, .menu .danger i { color: #fda4af; }

    /* ─── Modals ──────────────────────────────────────────────────────────── */
    .overlay {
      position: fixed; inset: 0; z-index: 300; display: none; align-items: center; justify-content: center; padding: 16px;
      background: rgba(3, 6, 12, 0.74); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    .overlay.open { display: flex; }
    .modal {
      width: 100%; max-width: 640px; max-height: calc(100vh - 32px); display: flex; flex-direction: column;
      background: var(--surface); border: 1px solid var(--line-strong); border-radius: 18px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55); animation: pop .18s ease-out;
    }
    .modal.wide { max-width: 860px; }
    @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: none; } }
    .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
    .modal-head h3 { font-size: 1.02rem; font-weight: 800; display: flex; align-items: center; gap: 10px; }
    .modal-body { padding: 18px 20px; overflow-y: auto; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-grid .full { grid-column: 1 / -1; }
    .label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--text-2); margin-bottom: 6px; }
    .input {
      width: 100%; height: 40px; border-radius: 10px; padding: 0 12px; outline: none;
      background: var(--bg); border: 1px solid var(--line); font-size: 0.88rem;
      transition: border-color .15s, box-shadow .15s;
    }
    .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124, 140, 255, 0.18); }
    .input:disabled { opacity: .55; }
    .hint { font-size: 0.72rem; color: var(--muted); margin-top: 5px; }

    .section-title { font-size: 0.78rem; font-weight: 800; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; margin: 18px 0 10px; display: flex; align-items: center; gap: 8px; }
    .section-title:first-child { margin-top: 0; }
    .info-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
    .notice { padding: 12px 14px; border-radius: 12px; font-size: 0.84rem; line-height: 1.6; border: 1px solid var(--line); background: var(--surface-2); color: var(--text-2); }
    .notice.warn { border-color: rgba(245, 158, 11, 0.3); background: rgba(245, 158, 11, 0.07); color: #fde68a; }
    .notice.bad { border-color: rgba(244, 63, 94, 0.3); background: rgba(244, 63, 94, 0.07); color: #fecdd3; }
    .notice.ok { border-color: rgba(34, 197, 94, 0.3); background: rgba(34, 197, 94, 0.07); color: #bbf7d0; }

    .list { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .list-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--surface); }
    .list-row:last-child { border-bottom: 0; }
    .list-row .title { font-weight: 700; font-size: 0.88rem; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .list-row .meta { font-size: 0.75rem; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; margin-top: 3px; }

    /* ─── Login ───────────────────────────────────────────────────────────── */
    .login {
      position: fixed; inset: 0; z-index: 500; display: flex; align-items: center; justify-content: center; padding: 16px;
      background: radial-gradient(ellipse 70% 50% at 50% 0%, rgba(239, 68, 68, 0.12), transparent 70%), var(--bg);
    }
    .login-card { width: 100%; max-width: 400px; padding: 32px 28px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line-strong); text-align: center; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5); }
    .login-card .brand-mark { width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 16px; font-size: 1.5rem; }
    .login-card h2 { font-size: 1.25rem; font-weight: 800; margin-bottom: 6px; }
    .login-card p { font-size: 0.84rem; color: var(--text-2); margin-bottom: 22px; }
    .login-card .input { height: 46px; text-align: center; font-family: var(--mono); letter-spacing: .15em; font-size: 1.05rem; }
    .login-row { display: flex; gap: 8px; margin-top: 12px; }
    .login-row .btn { height: 44px; }
    .login-err { color: #fda4af; font-size: 0.82rem; font-weight: 700; margin-top: 12px; min-height: 1.2em; }

    .toast {
      position: fixed; z-index: 600; bottom: 20px; inset-inline-start: 50%; transform: translateX(-50%);
      background: var(--surface-3); border: 1px solid var(--line-strong); color: var(--text);
      padding: 10px 16px; border-radius: 10px; font-size: 0.85rem; font-weight: 600; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }
    html[dir="rtl"] .toast { transform: translateX(50%); }

    /* ─── Responsive ──────────────────────────────────────────────────────── */
    @media (max-width: 1200px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 900px) {
      .topbar { flex-wrap: wrap; padding: 10px 16px; }
      .topbar-search { order: 3; flex-basis: 100%; max-width: none; margin: 0; }
      .topbar-actions { margin-inline-start: auto; }
      .topbar-actions .btn span { display: none; }
      .page { padding: 16px 16px 48px; }
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .kpi { padding: 12px 14px; }
      .kpi-value { font-size: 1.4rem; }
      .kpi:last-child:nth-child(odd) { grid-column: 1 / -1; }
      .segmented { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
      .segmented::-webkit-scrollbar { display: none; }
      .seg { flex-shrink: 0; }
      .shops thead { display: none; }
      .shops, .shops tbody, .shops tr, .shops td { display: block; width: 100%; }
      .shops tr { padding: 12px 14px; border-bottom: 1px solid var(--line); }
      .shops tbody tr:last-child { border-bottom: 0; }
      .shops td { border: 0; padding: 5px 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .shops td::before { content: attr(data-label); font-size: 0.72rem; font-weight: 700; color: var(--muted); }
      .shops td.td-shop::before, .shops td.td-actions::before { display: none; }
      .shops td.td-shop { padding-bottom: 8px; }
      .cell-stack { align-items: flex-end; }
      .row-actions { justify-content: flex-start; padding-top: 6px; }
      .form-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 420px) { .kpis { grid-template-columns: 1fr 1fr; } .brand p { display: none; } }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="login" class="login">
    <div class="login-card">
      <div class="brand-mark"><i class="fa-solid fa-shield-halved"></i></div>
      <h2 id="t-login-title">RedShark Master Portal</h2>
      <p id="t-login-sub"></p>
      <input type="password" id="master-key-input" class="input" placeholder="••••••••••" autocomplete="current-password">
      <div class="login-row">
        <button type="button" class="btn" style="flex:1" onclick="SuperAdmin.toggleLanguage()"><i class="fa-solid fa-globe"></i><span class="t-lang"></span></button>
        <button type="button" id="auth-submit-btn" class="btn btn-primary" style="flex:2" onclick="SuperAdmin.verifyMasterAuth()"><i class="fa-solid fa-lock-open"></i><span id="t-login-btn"></span></button>
      </div>
      <div id="auth-error-msg" class="login-err"></div>
    </div>
  </div>

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark"><i class="fa-solid fa-network-wired"></i></div>
      <div style="min-width:0">
        <h1>RedShark Master Portal</h1>
        <p id="t-subheading"></p>
      </div>
    </div>
    <div class="topbar-search">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="search" id="shop-search-input" oninput="SuperAdmin.filterShops(this.value)">
    </div>
    <div class="topbar-actions">
      <button type="button" class="btn" onclick="SuperAdmin.toggleLanguage()" title="Language / اللغة"><i class="fa-solid fa-globe"></i><span class="t-lang"></span></button>
      <button type="button" class="btn" onclick="SuperAdmin.loadShops()" id="btn-refresh"><i class="fa-solid fa-arrows-rotate"></i><span id="t-refresh"></span></button>
      <button type="button" class="btn btn-primary" onclick="SuperAdmin.openNewShopModal()"><i class="fa-solid fa-plus"></i><span id="t-new-shop"></span></button>
    </div>
  </header>

  <main class="page">
    <div id="status-notice" class="notice warn hidden" style="margin-bottom:14px"></div>
    <section class="kpis" id="kpis"></section>

    <section class="panel">
      <div class="panel-head">
        <div class="segmented" id="filters"></div>
        <div class="panel-meta"><span id="t-latest"></span><span id="latest-version" class="chip none mono">—</span><span id="last-refresh"></span></div>
      </div>
      <div class="table-wrap">
        <table class="shops">
          <thead>
            <tr>
              <th id="th-shop"></th>
              <th id="th-devices"></th>
              <th id="th-version"></th>
              <th id="th-license"></th>
              <th id="th-backup"></th>
              <th id="th-status"></th>
              <th style="text-align:end"></th>
            </tr>
          </thead>
          <tbody id="shops-table-body">
            <tr><td colspan="7"><div class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i><span id="t-loading"></span></div></td></tr>
          </tbody>
        </table>
      </div>

      function getShopPassword(t) { return parseBanner(t).admin_password || '1234'; }

      function getShopBranches(t) {
        const b = parseBanner(t);
        let raw = b.connected_branches || b.pos_branches || b.branches || [];
        if (!Array.isArray(raw)) raw = [];
        // Devices on v1.4.143+ report in pos_status (richer, and never touches the shop's settings).
        const slug = String(t.slug || '').toLowerCase();
        const rows = _statusRows.filter(r => String(r.slug || '').toLowerCase() === slug);
        if (rows.length) {
          const ids = new Set(rows.map(r => r.node_id));
          raw = raw.filter(i => !ids.has(i.nodeId)).concat(rows.map(r => Object.assign({}, r.data || {}, { nodeId: r.node_id, lastSeen: r.last_seen, nodeKey: r.node_key })));
        }
        const now = Date.now();
        return raw.map(item => {
          const lastSeenMs = item.lastSeen ? new Date(item.lastSeen).getTime() : 0;
          return Object.assign({}, item, {
            nodeId: item.nodeId || item.id || 'pos-node',
            name: item.name || item.nodeName || item.nodeId || 'Terminal',
            branchId: item.branchId || item.branch || 'main',
            role: item.role || 'branch',
            lastSeenMs,
            isOnline: lastSeenMs > 0 && now - lastSeenMs <= HEARTBEAT_THRESHOLD_MS && item.isOnline !== false
          });
        });
      }

      function daysLeft(dateStr) {
        if (!dateStr) return null;
        const end = new Date(String(dateStr).slice(0, 10) + 'T23:59:59').getTime();
        return isFinite(end) ? Math.ceil((end - Date.now()) / 86400000) : null;
      }

      // One summary per shop: worst version, licence of the main device, newest backup.
      function summarize(t) {
        const devices = getShopBranches(t);
        const banner = parseBanner(t);
        const online = devices.filter(d => d.isOnline);
        const main = devices.find(d => d.role === 'server') || devices[0] || null;

        const builds = devices.map(d => Number(d.appBuild) || 0).filter(Boolean);
        const minBuild = builds.length ? Math.min(...builds) : 0;
        const lowest = devices.filter(d => Number(d.appBuild) === minBuild)[0];
        const version = { build: minBuild, label: lowest && lowest.appVersion ? 'v' + lowest.appVersion : (minBuild ? tr('buildN', { n: minBuild }) : ''), mixed: new Set(builds).size > 1 };
        version.outdated = !!(_latest && minBuild && minBuild < _latest.build);

        const licDev = (main && main.license) ? main : devices.find(d => d.license);
        const lic = licDev ? licDev.license : null;
        let licState = 'unknown';
        let licDays = null;
        if (lic) {
          licDays = daysLeft(lic.expiry);
          if (lic.status === 'active') licState = licDays != null && licDays <= LICENSE_WARN_DAYS ? 'soon' : 'ok';
          else if (lic.status === 'demo') licState = 'demo';
          else if (lic.status === 'expired' || lic.status === 'demo_expired') licState = 'expired';
          else if (lic.status === 'invalid') licState = 'invalid';
          else licState = 'none';
        }

        const autoTimes = devices.map(d => d.localBackup && d.localBackup.at).filter(Boolean).sort();
        const lastAuto = autoTimes.length ? autoTimes[autoTimes.length - 1] : null;
        const cloudTimes = devices.map(d => d.cloudBackup && d.cloudBackup.last && d.cloudBackup.last.at).filter(Boolean).sort();
        const lastCloud = cloudTimes.length ? cloudTimes[cloudTimes.length - 1] : null;
        const supportsBackup = devices.some(d => d.cloudBackup);
        const autoAgeH = lastAuto ? (Date.now() - new Date(lastAuto).getTime()) / 3600000 : null;
        const backupStale = supportsBackup && (autoAgeH == null || autoAgeH > BACKUP_WARN_HOURS);

        return {
          t, devices, online, main, banner, version, lic, licState, licDays,
          lastAuto, lastCloud, supportsBackup, backupStale, autoAgeH,
          active: t.is_active !== false,
          needsLicense: licState === 'soon' || licState === 'expired' || licState === 'invalid'
        };
      }

      async function loadLatestVersion() {
        try {
          const r = await fetch('version.json?ts=' + Date.now(), { cache: 'no-store' });
          if (r.ok) { const v = await r.json(); _latest = { version: v.version, build: Number(v.build) || 0 }; }
        } catch (e) { }
        const el = document.getElementById('latest-version');
        if (el) el.textContent = _latest ? 'v' + _latest.version : '—';
      }

      async function loadStatusTables() {
        _statusError = '';
        try {
          const r = await fetch(`${SUPABASE_URL}/rest/v1/pos_status?select=*`, { headers: headers() });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          _statusRows = await r.json();
        } catch (e) { _statusRows = []; _statusError = e.message; }
        try {
          const r = await fetch(`${SUPABASE_URL}/rest/v1/pos_backup_requests?select=*`, { headers: headers() });
          const map = {};
          if (r.ok) for (const q of await r.json()) map[String(q.slug || '').toLowerCase()] = q;
          _requests = map;
        } catch (e) { }
      }

      async function loadShops() {
        const btn = document.getElementById('btn-refresh');
        if (btn) btn.querySelector('i').classList.add('fa-spin');
        try {
          await loadLatestVersion();
          const resp = await fetch(`${SUPABASE_URL}/rest/v1/tenants?select=*&order=created_at.desc`, { headers: headers() });
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          _allTenants = await resp.json();
          await loadStatusTables();
          _rows = _allTenants.map(summarize);
          _lastRefreshAt = new Date();
          showLastRefresh();
          if (!_menuEl) renderAll();
          // Refresh the open backup window too, unless the password field is being typed in.
          const typing = document.activeElement && document.activeElement.id === 'bk-unlock-pwd';
          if (_backupModalShop && !typing && document.getElementById('modal-backup').classList.contains('open')) renderBackupModal(true);
        } catch (e) {
          console.error(e);
          toast(tr('loadErr') + e.message);
        } finally {
          if (btn) btn.querySelector('i').classList.remove('fa-spin');
        }
      }

      // ─── KPIs, filters, table ──────────────────────────────────────────
      const FILTERS = [
        ['all', 'fAll', () => true],
        ['online', 'fOnline', r => r.online.length > 0],
        ['update', 'fUpdate', r => r.version.outdated],
        ['license', 'fLicense', r => r.needsLicense],
        ['backup', 'fBackup', r => r.backupStale],
        ['inactive', 'fInactive', r => !r.active]
      ];

      function showLastRefresh() {
        const lr = document.getElementById('last-refresh');
        if (lr && _lastRefreshAt) lr.textContent = '· ' + _lastRefreshAt.toLocaleTimeString(_lang === 'ar' ? 'ar-LB' : 'en-GB', { hour: '2-digit', minute: '2-digit' });
      }

      function renderAll() {
        showLastRefresh();
        const sn = document.getElementById('status-notice');
        if (sn) { sn.textContent = _statusError ? tr('statusMissing') : ''; sn.classList.toggle('hidden', !_statusError); }
        _rows = _allTenants.map(summarize);
        renderKpis();
        renderFilters();
        filterShops(_currentSearch);
      }

      function renderKpis() {
        const el = document.getElementById('kpis');
        if (!el) return;
        const devices = _rows.reduce((n, r) => n + r.devices.length, 0);
        const online = _rows.reduce((n, r) => n + r.online.length, 0);
        const cards = [
          ['all', 'kShops', _rows.length, tr('kShopsSub', { n: _rows.filter(r => r.active).length }), 'fa-store', 'accent'],
          ['online', 'kOnline', online, tr('kOnlineSub', { n: devices }), 'fa-satellite-dish', 'ok'],
          ['update', 'kUpdate', _rows.filter(r => r.version.outdated).length, tr('kUpdateSub'), 'fa-arrow-up-from-bracket', 'info'],
          ['license', 'kLicense', _rows.filter(r => r.needsLicense).length, tr('kLicenseSub', { n: LICENSE_WARN_DAYS }), 'fa-id-card', 'warn'],
          ['backup', 'kBackup', _rows.filter(r => r.backupStale).length, tr('kBackupSub'), 'fa-database', 'bad']
        ];
        el.innerHTML = cards.map(([f, label, val, sub, icon, tone]) => `
          <div class="kpi ${_currentFilter === f && f !== 'all' ? 'active' : ''}" onclick="SuperAdmin.setFilter('${f}')" role="button" tabindex="0">
            <div style="min-width:0">
              <div class="kpi-label">${esc(tr(label))}</div>
              <div class="kpi-value ${val && f !== 'all' && f !== 'online' ? 'tone-' + tone : ''}">${val}</div>
              <div class="kpi-sub">${esc(sub)}</div>
            </div>
            <div class="kpi-icon bg-${tone} tone-${tone}"><i class="fa-solid ${icon}"></i></div>
          </div>`).join('');
      }

      function renderFilters() {
        const el = document.getElementById('filters');
        if (!el) return;
        el.innerHTML = FILTERS.map(([key, label, fn]) => {
          const n = _rows.filter(fn).length;
          return `<button type="button" class="seg ${_currentFilter === key ? 'active' : ''}" onclick="SuperAdmin.setFilter('${key}')">${esc(tr(label))}<span class="count">${n}</span></button>`;
        }).join('');
      }

      function setFilter(key) {
        _currentFilter = key;
        renderKpis();
        renderFilters();
        filterShops(_currentSearch);
      }

      function filterShops(query) {
        _currentSearch = (query || '').toLowerCase().trim();
        const fn = (FILTERS.find(f => f[0] === _currentFilter) || FILTERS[0])[2];
        const list = _rows.filter(r => {
          const t = r.t;
          const q = _currentSearch;
          const hit = !q || [t.shop_name, t.slug, t.owner_phone, t.whatsapp_phone, r.lic && r.lic.client].some(v => v && String(v).toLowerCase().includes(q));
          return hit && fn(r);
        });
        renderShops(list);
      }

      const AVATAR_COLORS = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#14b8a6', '#0ea5e9', '#6366f1', '#a855f7', '#ec4899'];
      function avatarColor(s) { let h = 0; for (const c of String(s || '')) h = (h * 31 + c.charCodeAt(0)) >>> 0; return AVATAR_COLORS[h % AVATAR_COLORS.length]; }

      function devicesCell(r) {
        if (!r.devices.length) return `<span class="chip none">${esc(tr('noDevices'))}</span>`;
        const label = r.devices.length === 1 ? tr('device1') : tr('devicesN', { n: r.devices.length });
        const on = r.online.length;
        const newest = Math.max(...r.devices.map(d => d.lastSeenMs || 0));
        return `<div class="cell-stack">
          <button type="button" class="chip ${on ? 'ok' : 'warn'}" onclick="SuperAdmin.openBranchesModal('${esc(r.t.id)}')">
            <span class="dot ${on ? 'live' : ''}"></span>${esc(on ? tr('onlineN', { n: on }) : tr('offline'))}
          </button>
          <span class="cell-note">${esc(label)} · ${esc(on ? tr('online') : ago(newest ? new Date(newest).toISOString() : null))}</span>
        </div>`;
      }

      function versionCell(r) {
        const v = r.version;
        if (!v.build) return `<span class="chip none">—</span>`;
        if (!_latest) return `<span class="chip none mono">${esc(v.label)}</span>`;
        const cls = v.outdated ? 'warn' : 'ok';
        const icon = v.outdated ? 'fa-arrow-up' : 'fa-check';
        return `<div class="cell-stack">
          <span class="chip ${cls} mono"><i class="fa-solid ${icon}" style="font-size:.65rem"></i>${esc(v.label)}</span>
          <span class="cell-note">${esc(v.outdated ? tr('updateAvail') : tr('upToDate'))}${v.mixed ? ' · ' + esc(tr('mixed')) : ''}</span>
        </div>`;
      }

      function licenseCell(r) {
        const lic = r.lic;
        if (!lic) return r.devices.length ? `<span class="chip none" title="${esc(tr('needsNewVersion'))}">—</span>` : `<span class="chip none">—</span>`;
        const d = lic.expiry || '';
        let chip, note = lic.client || '';
        switch (r.licState) {
          case 'ok': chip = `<span class="chip ok"><i class="fa-solid fa-circle-check" style="font-size:.7rem"></i>${esc(tr('licActive', { d }))}</span>`; note = tr('licDaysLeft', { n: r.licDays }) + (lic.client ? ' · ' + lic.client : ''); break;
          case 'soon': chip = `<span class="chip warn"><i class="fa-solid fa-hourglass-half" style="font-size:.7rem"></i>${esc(tr('licDaysLeft', { n: Math.max(0, r.licDays) }))}</span>`; note = tr('licActive', { d }) + (lic.client ? ' · ' + lic.client : ''); break;
          case 'expired': chip = `<span class="chip bad"><i class="fa-solid fa-circle-xmark" style="font-size:.7rem"></i>${esc(lic.status === 'demo_expired' ? tr('licDemoExpired') : tr('licExpired'))}</span>`; note = d ? tr('licExpiredOn', { d }) : ''; break;
          case 'demo': chip = `<span class="chip info"><i class="fa-solid fa-flask" style="font-size:.7rem"></i>${esc(tr('licDemo', { d }))}</span>`; note = r.licDays != null ? tr('licDaysLeft', { n: Math.max(0, r.licDays) }) : ''; break;
          case 'invalid': chip = `<span class="chip bad">${esc(tr('licInvalid'))}</span>`; break;
          default: chip = `<span class="chip none">${esc(tr('licNone'))}</span>`;
        }
        return `<div class="cell-stack">${chip}${note ? `<span class="cell-note">${esc(note)}</span>` : ''}</div>`;
      }

      function backupCell(r) {
        if (!r.supportsBackup) {
          return `<button type="button" class="chip none" onclick="SuperAdmin.openBackupModal('${esc(r.t.id)}')" title="${esc(tr('needsNewVersion'))}"><i class="fa-solid fa-cloud" style="font-size:.7rem"></i>—</button>`;
        }
        const cls = r.autoAgeH == null ? 'bad' : r.autoAgeH > BACKUP_WARN_HOURS ? (r.autoAgeH > 24 * 7 ? 'bad' : 'warn') : 'ok';
        return `<div class="cell-stack">
          <button type="button" class="chip ${cls}" onclick="SuperAdmin.openBackupModal('${esc(r.t.id)}')">
            <i class="fa-solid fa-database" style="font-size:.7rem"></i>${esc(r.lastAuto ? tr('autoBackup') + ' · ' + ago(r.lastAuto) : tr('noAutoBackup'))}
          </button>
          <span class="cell-note"><i class="fa-solid fa-cloud" style="font-size:.65rem"></i> ${esc(r.lastCloud ? tr('cloudCopy') + ' · ' + ago(r.lastCloud) : tr('cloudCopy') + ' · —')}</span>
        </div>`;
      }

      function renderShops(list) {
        const tbody = document.getElementById('shops-table-body');
        if (!tbody) return;
        if (!list.length) {
          tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><i class="fa-regular fa-folder-open"></i>${esc(tr('noShops'))}</div></td></tr>`;
          return;
        }
        tbody.innerHTML = list.map(r => {
          const t = r.t;
          const id = esc(t.id);
          const name = t.shop_name || 'Untitled';
          const phone = t.whatsapp_phone || t.owner_phone || '';
          return `<tr class="${r.active ? '' : 'is-inactive'}">
            <td class="td-shop">
              <div class="shop-cell">
                <div class="avatar" style="background:${avatarColor(t.slug || name)}">${esc(name.trim().charAt(0).toUpperCase() || '?')}</div>
                <div style="min-width:0">
                  <div class="shop-name">${esc(name)}</div>
                  <div class="shop-sub">
                    <span class="slug">${esc(t.slug)}</span>
                    ${phone ? `<span class="mono">${esc(phone)}</span>` : ''}
                    <span class="pwd" title="${esc(tr('lblPwd'))}"><i class="fa-solid fa-key" style="font-size:.62rem"></i><span id="pwd-val-${id}">••••</span>
                      <button type="button" onclick="SuperAdmin.togglePwdDisplay('${id}')" title="${esc(tr('showPwd'))}"><i class="fa-regular fa-eye" id="pwd-icon-${id}"></i></button>
                    </span>
                  </div>
                </div>
              </div>
            </td>
            <td data-label="${esc(tr('thDevices'))}">${devicesCell(r)}</td>
            <td data-label="${esc(tr('thVersion'))}">${versionCell(r)}</td>
            <td data-label="${esc(tr('thLicense'))}">${licenseCell(r)}</td>
            <td data-label="${esc(tr('thBackup'))}">${backupCell(r)}</td>
            <td data-label="${esc(tr('thStatus'))}"><span class="chip ${r.active ? 'ok' : 'bad'}"><span class="dot"></span>${esc(r.active ? tr('active') : tr('inactive'))}</span></td>
            <td class="td-actions">
              <div class="row-actions">
                <a class="btn btn-sm" href="index.html?shop=${encodeURIComponent(t.slug || '')}" target="_blank" rel="noopener" title="${esc(tr('open'))}"><i class="fa-solid fa-arrow-up-right-from-square"></i></a>
                <a class="btn btn-sm" href="admin.html?shop=${encodeURIComponent(t.slug || '')}" target="_blank" rel="noopener" title="${esc(tr('admin'))}"><i class="fa-solid fa-gauge-high"></i></a>
                <button type="button" class="btn btn-sm btn-accent" onclick="SuperAdmin.openBackupModal('${id}')"><i class="fa-solid fa-cloud-arrow-down"></i><span>${esc(tr('backup'))}</span></button>
                <button type="button" class="btn btn-sm btn-icon btn-ghost" onclick="SuperAdmin.openRowMenu('${id}', this)" title="${esc(tr('more'))}"><i class="fa-solid fa-ellipsis-vertical"></i></button>
              </div>
            </td>
          </tr>`;
        }).join('');
      }

      function togglePwdDisplay(id) {
        const t = _allTenants.find(x => x.id === id);
        const textEl = document.getElementById('pwd-val-' + id);
        const iconEl = document.getElementById('pwd-icon-' + id);
        if (!t || !textEl) return;
        const hidden = textEl.textContent === '••••';
        textEl.textContent = hidden ? getShopPassword(t) : '••••';
        if (iconEl) iconEl.className = hidden ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
      }

      // ─── Row menu ──────────────────────────────────────────────────────
      function closeRowMenu() {
        if (_menuEl) { _menuEl.remove(); _menuEl = null; }
      }
      function openRowMenu(id, btn) {
        const wasOpen = _menuEl && _menuEl.dataset.id === id;
        closeRowMenu();
        if (wasOpen) return;
        const t = _allTenants.find(x => x.id === id);
        if (!t) return;
        const m = document.createElement('div');
        m.className = 'menu';
        m.dataset.id = id;
        m.innerHTML = `
          <button type="button" data-act="edit"><i class="fa-solid fa-pen-to-square"></i>${esc(tr('edit'))}</button>
          <button type="button" data-act="devices"><i class="fa-solid fa-network-wired"></i>${esc(tr('devices'))}</button>
          <button type="button" data-act="copy"><i class="fa-regular fa-copy"></i>${esc(tr('copyPwd'))}</button>
          <div class="sep"></div>
          <button type="button" data-act="reset"><i class="fa-solid fa-rotate-left"></i>${esc(tr('reset'))}</button>
          <button type="button" data-act="delete" class="danger"><i class="fa-solid fa-trash-can"></i>${esc(tr('del'))}</button>`;
        m.addEventListener('click', (e) => {
          const b = e.target.closest('button[data-act]');
          if (!b) return;
          const act = b.dataset.act;
          closeRowMenu();
          if (act === 'edit') openEditShopModal(id);
          else if (act === 'devices') openBranchesModal(id);
          else if (act === 'copy') { navigator.clipboard.writeText(getShopPassword(t)).then(() => toast(tr('copied'))).catch(() => { }); }
          else if (act === 'reset') resetShopData(id, t.slug);
          else if (act === 'delete') deleteShopTotally(id, t.slug);
        });
        document.body.appendChild(m);
        _menuEl = m;
        const rc = btn.getBoundingClientRect();
        const mw = m.offsetWidth, mh = m.offsetHeight;
        let left = document.documentElement.dir === 'rtl' ? rc.left : rc.right - mw;
        left = Math.max(8, Math.min(left, window.innerWidth - mw - 8));
        let top = rc.bottom + 6;
        if (top + mh > window.innerHeight - 8) top = Math.max(8, rc.top - mh - 6);
        m.style.left = left + 'px';
        m.style.top = top + 'px';
      }
      document.addEventListener('click', (e) => {
        if (_menuEl && !e.target.closest('.menu') && !e.target.closest('[onclick*="openRowMenu"]')) { closeRowMenu(); renderAll(); }
      });
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        closeRowMenu();
        ['modal-branches', 'modal-backup', 'modal-shop'].forEach(i => document.getElementById(i).classList.remove('open'));
        _backupModalShop = null;
      });
      window.addEventListener('scroll', () => { if (_menuEl) { closeRowMenu(); renderAll(); } }, true);

      // ─── Devices modal ─────────────────────────────────────────────────
      function licText(lic) {
        if (!lic) return '—';
        const d = lic.expiry || '';
        if (lic.status === 'active') return tr('licActive', { d });
        if (lic.status === 'demo') return tr('licDemo', { d });
        if (lic.status === 'expired') return tr('licExpiredOn', { d });
        if (lic.status === 'demo_expired') return tr('licDemoExpired');
        if (lic.status === 'invalid') return tr('licInvalid');
        return tr('licNone');
      }

      function openBranchesModal(shopId) {
        const t = _allTenants.find(x => x.id === shopId);
        if (!t) return;
        const devices = getShopBranches(t);
        const body = document.getElementById('branches-body');
        body.innerHTML = `
          <div class="info-bar" style="margin-bottom:14px">
            <div><strong>${esc(t.shop_name)}</strong> <span class="slug" style="margin-inline-start:8px">${esc(t.slug)}</span></div>
            <span class="chip none">${esc(devices.length === 1 ? tr('device1') : tr('devicesN', { n: devices.length }))}</span>
          </div>
          ${!devices.length ? `<div class="empty-state"><i class="fa-solid fa-network-wired"></i>${esc(tr('noDevices'))}</div>` : `<div class="list">${devices.map(d => {
            const isServer = d.role === 'server';
            return `<div class="list-row">
              <div style="min-width:0">
                <div class="title">
                  <span class="chip ${d.isOnline ? 'ok' : 'warn'}" style="height:22px"><span class="dot ${d.isOnline ? 'live' : ''}"></span>${esc(d.isOnline ? tr('online') : tr('offline'))}</span>
                  ${esc(d.name)}
                  <span class="chip ${isServer ? 'info' : 'none'}" style="height:22px">${esc(isServer ? tr('serverRole') : tr('branchRole'))}</span>
                </div>
                <div class="meta">
                  <span><i class="fa-solid fa-microchip"></i> <span class="mono">${esc(d.nodeId)}</span></span>
                  <span><i class="fa-regular fa-clock"></i> ${esc(tr('lastSeen'))}: ${esc(ago(d.lastSeen))}</span>
                  <span><i class="fa-solid fa-code-branch"></i> ${esc(tr('version'))}: <span class="mono">${esc(d.appVersion ? 'v' + d.appVersion : (d.appBuild ? tr('buildN', { n: d.appBuild }) : '—'))}</span></span>
                  <span><i class="fa-solid fa-id-card"></i> ${esc(tr('license'))}: ${esc(licText(d.license))}</span>
                  <span><i class="fa-solid fa-database"></i> ${esc(tr('lastAuto'))}: ${esc(d.localBackup ? ago(d.localBackup.at) : '—')}</span>
                </div>
              </div>
              <button type="button" class="btn btn-sm btn-danger" onclick="SuperAdmin.removeBranchNode('${esc(t.id)}', '${esc(d.nodeId)}')"><i class="fa-solid fa-trash-can"></i><span>${esc(tr('remove'))}</span></button>
            </div>`;
          }).join('')}</div>`}`;
        document.getElementById('modal-branches').classList.add('open');
      }
      function closeBranchesModal() { document.getElementById('modal-branches').classList.remove('open'); }

      // Re-read the shop just before writing, so a heartbeat written a moment ago is not lost.
      async function fetchTenant(shopId) {
        const r = await fetch(`${SUPABASE_URL}/rest/v1/tenants?id=eq.${encodeURIComponent(shopId)}&select=*`, { headers: headers() });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const rows = await r.json();
        if (!rows[0]) throw new Error('Shop not found');
        return rows[0];
      }
      async function patchBanner(shopId, banner) {
        const r = await fetch(`${SUPABASE_URL}/rest/v1/tenants?id=eq.${encodeURIComponent(shopId)}`, {
          method: 'PATCH', headers: headers({ 'Content-Type': 'application/json' }), body: JSON.stringify({ banner_url: JSON.stringify(banner) })
        });
        if (!r.ok) throw new Error(await r.text());
      }

      async function removeBranchNode(shopId, nodeId) {
        if (!confirm(tr('removeConfirm', { n: nodeId }))) return;
        try {
          const b = parseBanner(await fetchTenant(shopId));
          if (Array.isArray(b.connected_branches)) b.connected_branches = b.connected_branches.filter(i => i.nodeId !== nodeId);
          if (Array.isArray(b.pos_branches)) b.pos_branches = b.pos_branches.filter(i => i.nodeId !== nodeId);
          await patchBanner(shopId, b);
          await fetch(`${SUPABASE_URL}/rest/v1/pos_status?slug=eq.${encodeURIComponent(shopSlug(shopId))}&node_id=eq.${encodeURIComponent(nodeId)}`, { method: 'DELETE', headers: headers() }).catch(() => { });
          toast(tr('nodeRemoved'));
          await loadShops();
          openBranchesModal(shopId);
        } catch (e) { alert(tr('error') + e.message); }
      }

      // ─── Backup: crypto helpers ────────────────────────────────────────
      const b64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
      async function unlockBackupKey(password) {
        const w = BACKUP_KEY_WRAPPED;
        if (!w) throw new Error('no key');
        const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
        const aes = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(w.salt), iterations: w.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
        const pkcs8 = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(w.iv) }, aes, b64(w.data));
        _backupKey = await crypto.subtle.importKey('pkcs8', pkcs8, { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['decrypt']);
        return _backupKey;
      }
      // "RSBK1" | uint16 len | RSA-OAEP wrapped AES key | 12-byte IV | AES-GCM(gzip JSON)
      async function decryptBackup(buf) {
        const u = new Uint8Array(buf);
        if (String.fromCharCode(...u.slice(0, 5)) !== 'RSBK1') throw new Error('Not a Red Shark cloud backup');
        const len = (u[5] << 8) | u[6];
        const wrapped = u.slice(7, 7 + len);
        const iv = u.slice(7 + len, 19 + len);
        const data = u.slice(19 + len);
        const raw = await crypto.subtle.decrypt({ name: 'RSA-OAEP' }, _backupKey, wrapped);
        const aes = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
        const gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, aes, data);
        return new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).blob();
      }

      // ─── Backup modal ──────────────────────────────────────────────────
      let _cloudList = { shopId: null, items: null, error: null };

      const shopSlug = (shopId) => String((_allTenants.find(x => x.id === shopId) || {}).slug || '').toLowerCase();

      async function loadCloudList(shopId) {
        _cloudList = { shopId, items: null, error: null };
        try {
          const r = await fetch(`${SUPABASE_URL}/storage/v1/object/list/${BACKUP_BUCKET}`, {
            method: 'POST', headers: headers({ 'Content-Type': 'application/json' }),
            body: JSON.stringify({ prefix: shopSlug(shopId), limit: 100, offset: 0, sortBy: { column: 'name', order: 'desc' } })
          });
          if (!r.ok) throw new Error(r.status === 400 || r.status === 404 ? 'storage-missing' : 'HTTP ' + r.status);
          const items = (await r.json()).filter(i => i && i.name && /\.rsbk$/.test(i.name));
          _cloudList = { shopId, items, error: null };
        } catch (e) {
          _cloudList = { shopId, items: [], error: e.message };
        }
      }

      function parseBackupName(name) {
        // 20261120_143015__POS-01-RedSharkPOS_default__live.rsbk  (time in UTC)
        const m = /^(\d{8})_(\d{6})__(.+?)__(.+)\.rsbk$/.exec(name);
        if (!m) return { at: null, node: name, source: '' };
        const at = new Date(`${m[1].slice(0, 4)}-${m[1].slice(4, 6)}-${m[1].slice(6, 8)}T${m[2].slice(0, 2)}:${m[2].slice(2, 4)}:${m[2].slice(4, 6)}Z`);
        return { at, node: m[3], source: m[4] };
      }

      async function openBackupModal(shopId) {
        _backupModalShop = shopId;
        document.getElementById('modal-backup').classList.add('open');
        _cloudList = { shopId, items: null, error: null };
        renderBackupModal();
        await loadCloudList(shopId);
        if (_backupModalShop === shopId) renderBackupModal();
      }
      function closeBackupModal() {
        _backupModalShop = null;
        document.getElementById('modal-backup').classList.remove('open');
      }

      function backupRequestState(r) {
        const q0 = _requests[String(r.t.slug || '').toLowerCase()];
        const req = q0 ? { id: q0.req_id, at: q0.at } : null;
        if (!req || !req.id) return null;
        const done = r.devices.some(d => d.cloudBackup && d.cloudBackup.last && d.cloudBackup.last.req === req.id);
        const preparing = r.devices.some(d => d.cloudBackup && d.cloudBackup.pendingReq === req.id);
        const ageH = (Date.now() - new Date(req.at).getTime()) / 3600000;
        if (done) return { cls: 'ok', text: tr('bkDone') };
        if (ageH > 24) return null;
        if (preparing) return { cls: 'info', text: tr('bkPreparing') };
        return { cls: 'warn', text: tr('bkWaiting', { t: ago(req.at) }) };
      }

      function renderBackupModal(refreshListToo) {
        const r = _rows.find(x => x.t.id === _backupModalShop);
        const body = document.getElementById('backup-body');
        if (!r || !body) return;
        if (refreshListToo) loadCloudList(r.t.id).then(() => { if (_backupModalShop === r.t.id) renderBackupModal(); });
        const notices = [];
        if (!BACKUP_KEY_WRAPPED) notices.push(`<div class="notice warn"><i class="fa-solid fa-key"></i> ${esc(tr('bkNotSetup'))}</div>`);
        if (r.devices.length && !r.supportsBackup) notices.push(`<div class="notice warn"><i class="fa-solid fa-arrow-up"></i> ${esc(tr('bkOldVersion'))}</div>`);
        if (r.supportsBackup && !r.devices.some(d => d.cloudBackup && d.cloudBackup.ready)) notices.push(`<div class="notice warn"><i class="fa-solid fa-key"></i> ${esc(tr('bkNoKeyOnShop'))}</div>`);
        const errDev = r.devices.find(d => d.cloudBackup && d.cloudBackup.error);
        if (errDev) notices.push(`<div class="notice bad"><i class="fa-solid fa-triangle-exclamation"></i> ${esc(tr('bkError', { e: errDev.cloudBackup.error }))} <span class="muted">(${esc(ago(errDev.cloudBackup.errorAt))})</span></div>`);
        const st = backupRequestState(r);
        if (st && !r.online.length && st.cls === 'warn') notices.push(`<div class="notice"><i class="fa-solid fa-plug-circle-xmark"></i> ${esc(tr('bkOffline'))}</div>`);

        const canRequest = r.supportsBackup && !!BACKUP_KEY_WRAPPED;

        let listHtml;
        if (_cloudList.items === null) listHtml = `<div class="empty-state" style="padding:28px"><i class="fa-solid fa-spinner fa-spin"></i></div>`;
        else if (_cloudList.error === 'storage-missing') listHtml = `<div class="notice warn">${esc(tr('bkStorageMissing'))}</div>`;
        else if (_cloudList.error) listHtml = `<div class="notice bad">${esc(tr('error') + _cloudList.error)}</div>`;
        else if (!_cloudList.items.length) listHtml = `<div class="empty-state" style="padding:28px"><i class="fa-solid fa-cloud"></i>${esc(tr('bkNone'))}</div>`;
        else listHtml = `<div class="list">${_cloudList.items.map(it => {
          const p = parseBackupName(it.name);
          const size = it.metadata && it.metadata.size;
          const kind = p.source === 'live' ? tr('bkLive') : (p.source.startsWith('daily-') ? tr('bkDaily', { d: p.source.slice(6) }) : p.source);
          return `<div class="list-row">
            <div style="min-width:0">
              <div class="title"><i class="fa-solid fa-file-shield tone-accent"></i>${esc(p.at ? fmtDateTime(p.at) : it.name)}</div>
              <div class="meta"><span class="mono">${esc(p.node)}</span><span>${esc(kind)}</span>${size ? `<span>${esc(fmtSize(size))}</span>` : ''}</div>
            </div>
            <button type="button" class="btn btn-sm btn-accent" onclick="SuperAdmin.downloadBackup(this, '${esc(r.t.id)}', '${esc(it.name)}')" ${BACKUP_KEY_WRAPPED ? '' : 'disabled'}><i class="fa-solid fa-download"></i><span>${esc(tr('bkDownload'))}</span></button>
          </div>`;
        }).join('')}</div>`;

        const unlockHtml = (BACKUP_KEY_WRAPPED && !_backupKey) ? `
          <div class="section-title"><i class="fa-solid fa-lock"></i>${esc(tr('bkUnlock'))}</div>
          <div style="display:flex;gap:8px">
            <input type="password" id="bk-unlock-pwd" class="input" style="flex:1" autocomplete="current-password" onkeydown="if(event.key==='Enter')SuperAdmin.unlockFromModal()">
            <button type="button" class="btn btn-accent" onclick="SuperAdmin.unlockFromModal()"><i class="fa-solid fa-lock-open"></i><span>${esc(tr('bkUnlockBtn'))}</span></button>
          </div>
          <div id="bk-unlock-err" class="hint" style="color:#fda4af"></div>` : '';

        body.innerHTML = `
          <div class="info-bar" style="margin-bottom:14px">
            <div><strong>${esc(r.t.shop_name)}</strong> <span class="slug" style="margin-inline-start:8px">${esc(r.t.slug)}</span></div>
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
              ${st ? `<span class="chip ${st.cls}">${esc(st.text)}</span>` : ''}
              <button type="button" class="btn btn-sm btn-primary" onclick="SuperAdmin.requestBackup('${esc(r.t.id)}')" ${canRequest ? '' : 'disabled'}><i class="fa-solid fa-cloud-arrow-up"></i><span>${esc(tr('bkRequest'))}</span></button>
            </div>
          </div>
          <div class="notice" style="margin-bottom:12px"><i class="fa-solid fa-shield-halved"></i> ${esc(tr('bkIntro'))} ${esc(tr('bkRestoreHint'))}</div>
          ${notices.length ? `<div style="display:grid;gap:8px;margin-bottom:12px">${notices.join('')}</div>` : ''}
          <div class="section-title"><i class="fa-solid fa-desktop"></i>${esc(tr('bkDevices'))}</div>
          ${r.devices.length ? `<div class="list">${r.devices.map(d => `
            <div class="list-row">
              <div style="min-width:0">
                <div class="title"><span class="dot ${d.isOnline ? 'live tone-ok' : 'tone-warn'}"></span>${esc(d.name)} <span class="mono muted" style="font-size:.74rem">${esc(d.nodeId)}</span></div>
                <div class="meta">
                  <span><i class="fa-solid fa-database"></i> ${esc(tr('lastAuto'))}: ${esc(d.localBackup ? ago(d.localBackup.at) + ' · ' + fmtSize(d.localBackup.size) : '—')}</span>
                  <span><i class="fa-solid fa-cloud"></i> ${esc(tr('cloudCopy'))}: ${esc(d.cloudBackup && d.cloudBackup.last ? ago(d.cloudBackup.last.at) : '—')}</span>
                </div>
              </div>
            </div>`).join('')}</div>` : `<div class="empty-state" style="padding:20px">${esc(tr('noDevices'))}</div>`}
          ${unlockHtml}
          <div class="section-title"><i class="fa-solid fa-cloud"></i>${esc(tr('bkCloudList'))}</div>
          ${listHtml}`;
      }

      async function unlockFromModal() {
        const input = document.getElementById('bk-unlock-pwd');
        const err = document.getElementById('bk-unlock-err');
        try {
          await unlockBackupKey((input.value || '').trim());
          renderBackupModal();
        } catch (e) {
          if (err) err.textContent = tr('bkWrongPwd');
          if (input) { input.value = ''; input.focus(); }
        }
      }

      async function requestBackup(shopId) {
        try {
          const t = _allTenants.find(x => x.id === shopId);
          const r = await fetch(`${SUPABASE_URL}/rest/v1/pos_backup_requests?on_conflict=slug`, {
            method: 'POST',
            headers: headers({ 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
            body: JSON.stringify({ slug: String(t.slug || '').toLowerCase(), req_id: 'REQ-' + Date.now().toString(36).toUpperCase(), at: new Date().toISOString() })
          });
          if (!r.ok) throw new Error(await r.text());
          toast(tr('bkRequested'));
          await loadShops();
          if (_backupModalShop === shopId) renderBackupModal();
        } catch (e) { alert(tr('error') + e.message); }
      }

      async function downloadBackup(btn, shopId, name) {
        if (!_backupKey) {
          const input = document.getElementById('bk-unlock-pwd');
          if (input) input.focus();
          toast(tr('bkUnlock'));
          return;
        }
        const old = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i><span>${esc(tr('bkDecrypting'))}</span>`;
        try {
          const r = await fetch(`${SUPABASE_URL}/storage/v1/object/authenticated/${BACKUP_BUCKET}/${encodeURIComponent(shopSlug(shopId))}/${encodeURIComponent(name)}`, { headers: headers() });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          const json = await decryptBackup(await r.arrayBuffer());
          const t = _allTenants.find(x => x.id === shopId);
          const p = parseBackupName(name);
          const stamp = p.at ? new Date(p.at.getTime() - p.at.getTimezoneOffset() * 60000).toISOString().slice(0, 16).replace('T', '_').replace(':', '') : 'backup';
          const a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
          a.download = `redshark_backup_${(t && t.slug) || 'shop'}_${stamp}_${p.node}.json`.replace(/[^A-Za-z0-9._-]+/g, '-');
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(a.href), 60000);
          toast(tr('bkSaved'));
        } catch (e) {
          alert(tr('error') + e.message);
        } finally {
          btn.disabled = false;
          btn.innerHTML = old;
        }
      }

      // ─── Create / edit shop ────────────────────────────────────────────
      function openNewShopModal() {
        document.getElementById('edit-shop-id').value = '';
        document.getElementById('modal-shop-title').innerHTML = `<i class="fa-solid fa-store tone-bad"></i><span>${esc(tr('modalNew'))}</span>`;
        document.getElementById('btn-save-shop-text').textContent = tr('saveNew');
        document.getElementById('shop-name-input').value = '';
        document.getElementById('shop-slug-input').value = '';
        document.getElementById('shop-slug-input').disabled = false;
        document.getElementById('shop-pwd-input').value = '1234';
        document.getElementById('shop-phone-input').value = '';
        document.getElementById('shop-delivery-input').value = '2';
        document.getElementById('shop-lbp-input').value = '89500';
        document.getElementById('modal-shop').classList.add('open');
        setTimeout(() => document.getElementById('shop-name-input').focus(), 50);
      }

      function openEditShopModal(id) {
        const t = _allTenants.find(x => x.id === id);
        if (!t) return;
        document.getElementById('edit-shop-id').value = t.id;
        document.getElementById('modal-shop-title').innerHTML = `<i class="fa-solid fa-pen-to-square tone-accent"></i><span>${esc(tr('modalEdit') + (t.shop_name || ''))}</span>`;
        document.getElementById('btn-save-shop-text').textContent = tr('saveEdit');
        document.getElementById('shop-name-input').value = t.shop_name || '';
        document.getElementById('shop-slug-input').value = t.slug || '';
        document.getElementById('shop-slug-input').disabled = true;
        document.getElementById('shop-pwd-input').value = getShopPassword(t);
        document.getElementById('shop-phone-input').value = t.whatsapp_phone || t.owner_phone || '';
        document.getElementById('shop-delivery-input').value = t.delivery_fee || 2;
        document.getElementById('shop-lbp-input').value = t.currency_lbp_rate || 89500;
        document.getElementById('modal-shop').classList.add('open');
      }
      function closeShopModal() { document.getElementById('modal-shop').classList.remove('open'); }

      async function saveShop() {
        const id = document.getElementById('edit-shop-id').value;
        const name = document.getElementById('shop-name-input').value.trim();
        const slug = document.getElementById('shop-slug-input').value.trim().toLowerCase();
        const pwd = document.getElementById('shop-pwd-input').value.trim() || '1234';
        const phone = document.getElementById('shop-phone-input').value.trim();
        const delivery = parseFloat(document.getElementById('shop-delivery-input').value) || 2;
        const lbp = parseInt(document.getElementById('shop-lbp-input').value, 10) || 89500;
        if (!name) return alert(tr('needName'));
        try {
          if (!id) {
            if (!slug) return alert(tr('needSlug'));
            if (_allTenants.some(t => t.slug === slug)) return alert(tr('slugTaken'));
            const initialBanner = {
              admin_password: pwd,
              active: true,
              slides: [{
                active: true,
                title: 'أهلاً بكم في متجرنا الإلكتروني!',
                subtitle: 'أفضل العروض والمنتجات بأفضل الأسعار وأسرع خدمة توصيل',
                badge: 'متجر رسمي معتمد',
                image_url: 'https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1200&q=80'
              }],
              connected_branches: []
            };
            const payload = {
              shop_name: name, slug, whatsapp_phone: phone, owner_phone: phone,
              delivery_fee: delivery, currency_lbp_rate: lbp, currency: 'USD',
              is_active: true, link_pos_stock: true, allow_out_of_stock: false,
              banner_url: JSON.stringify(initialBanner)
            };
            const resp = await fetch(`${SUPABASE_URL}/rest/v1/tenants`, {
              method: 'POST', headers: headers({ 'Content-Type': 'application/json', 'Prefer': 'return=representation' }), body: JSON.stringify(payload)
            });
            if (!resp.ok) throw new Error(await resp.text());
            toast(tr('created'));
          } else {
            const bannerObj = parseBanner(await fetchTenant(id));
            bannerObj.admin_password = pwd;
            const payload = { shop_name: name, whatsapp_phone: phone, delivery_fee: delivery, currency_lbp_rate: lbp, banner_url: JSON.stringify(bannerObj) };
            const resp = await fetch(`${SUPABASE_URL}/rest/v1/tenants?id=eq.${encodeURIComponent(id)}`, {
              method: 'PATCH', headers: headers({ 'Content-Type': 'application/json', 'Prefer': 'return=representation' }), body: JSON.stringify(payload)
            });
            if (!resp.ok) throw new Error(await resp.text());
            toast(tr('updated'));
          }
          closeShopModal();
          await loadShops();
        } catch (e) { alert(tr('error') + e.message); }
      }

      // ─── Reset online-store data ───────────────────────────────────────
      async function deleteStoreRows(shopId) {
        const h = headers();
        const ordersRes = await fetch(`${SUPABASE_URL}/rest/v1/orders?shop_id=eq.${shopId}&select=id`, { headers: h });
        if (ordersRes.ok) {
          const ids = (await ordersRes.json() || []).map(o => o.id);
          for (let i = 0; i < ids.length; i += 50) {
            await fetch(`${SUPABASE_URL}/rest/v1/order_items?order_id=in.(${ids.slice(i, i + 50).join(',')})`, { method: 'DELETE', headers: h });
          }
        }
        await fetch(`${SUPABASE_URL}/rest/v1/orders?shop_id=eq.${shopId}`, { method: 'DELETE', headers: h });
        await fetch(`${SUPABASE_URL}/rest/v1/products?shop_id=eq.${shopId}`, { method: 'DELETE', headers: h });
        await fetch(`${SUPABASE_URL}/rest/v1/categories?shop_id=eq.${shopId}`, { method: 'DELETE', headers: h });
      }

      async function resetShopData(shopId, slug) {
        if (!confirm(tr('resetConfirm', { s: slug }))) return;
        try {
          await deleteStoreRows(shopId);
          const bannerObj = parseBanner(await fetchTenant(shopId));
          const cleanBanner = {
            admin_password: bannerObj.admin_password || '1234',
            active: true,
            slides: [],
            cloud_sync_seq: Date.now(),
            last_change_type: 'reset',
            last_change_desc: 'Shop cloud data reset',
            last_change_time: new Date().toISOString(),
            connected_branches: bannerObj.connected_branches || []
          };
          await patchBanner(shopId, cleanBanner);
          toast(tr('resetDone', { s: slug }));
          await loadShops();
        } catch (e) { alert(tr('error') + e.message); }
      }

      // ─── Delete shop ───────────────────────────────────────────────────
      async function deleteShopTotally(shopId, slug) {
        const typed = prompt(tr('deleteConfirm', { s: slug }));
        if (!typed || typed.trim().toLowerCase() !== String(slug).toLowerCase()) {
          if (typed !== null) alert(tr('deleteAbort'));
          return;
        }
        try {
          await deleteStoreRows(shopId);
          const del = await fetch(`${SUPABASE_URL}/rest/v1/tenants?id=eq.${shopId}`, { method: 'DELETE', headers: headers() });
          if (!del.ok) throw new Error(await del.text());
          toast(tr('deleteDone', { s: slug }));
          await loadShops();
        } catch (e) { alert(tr('error') + e.message); }
      }

      // Live refresh every 30 s (paused while a menu is open)
      setInterval(() => { if (sessionStorage.getItem('rs_master_auth') === 'true' && !_menuEl) loadShops(); }, 30000);

      function init() {
        applyLanguage(_lang);
        const login = document.getElementById('login');
        const input = document.getElementById('master-key-input');
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') verifyMasterAuth(); });
        if (sessionStorage.getItem('rs_master_auth') === 'true') {
          login.classList.add('hidden');
          loadShops();
        } else {
          input.focus();
        }
      }

      return {
        init, toggleLanguage, verifyMasterAuth, loadShops, filterShops, setFilter, togglePwdDisplay,
        openRowMenu, openBranchesModal, closeBranchesModal, removeBranchNode,
        openBackupModal, closeBackupModal, requestBackup, downloadBackup, unlockFromModal,
        openNewShopModal, openEditShopModal, closeShopModal, saveShop, resetShopData, deleteShopTotally
      };
    })();

    document.addEventListener('DOMContentLoaded', SuperAdmin.init);
  </script>
